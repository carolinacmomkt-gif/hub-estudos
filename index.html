<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bússola</title>
  <meta name="description" content="Bússola: o app de vida e rotina da Carol, com faculdade, estudos, criação, cadernos e calendário.">
  <meta name="theme-color" content="#17110D">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <!-- Aplica o tema antes de pintar a tela, para não piscar -->
  <script src="js/tema-inicial.js"></script>
  <link rel="stylesheet" href="css/temas.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/calendario.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/youtube.css">
  <link rel="stylesheet" href="css/areas.css">
  <link rel="stylesheet" href="css/cadernos.css">
  <link rel="stylesheet" href="css/foco.css">
  <link rel="stylesheet" href="css/tarefas.css">
  <link rel="stylesheet" href="css/financas.css">
  <link rel="stylesheet" href="css/padroes.css">
</head>
<body>
  <a class="pular-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">
    <nav class="nav-lateral" id="nav-lateral" aria-label="Navegação principal"></nav>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <nav class="nav-inferior" id="nav-inferior" aria-label="Navegação principal"></nav>

  <dialog class="folha" id="folha-mais" aria-labelledby="folha-mais-titulo">
    <div class="folha-alca" aria-hidden="true"></div>
    <h2 class="folha-titulo" id="folha-mais-titulo">Todas as áreas</h2>
    <div id="folha-mais-lista"></div>
    <button class="botao botao-secundario folha-fechar" type="button" data-acao="fechar-mais">Fechar</button>
  </dialog>

  <button class="fab" id="fab-criar" type="button" data-acao="abrir-criar" aria-haspopup="dialog" aria-label="Criar: anotar uma ideia rápida">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog class="folha" id="folha-criar" aria-labelledby="folha-criar-titulo">
    <div class="folha-alca" aria-hidden="true"></div>
    <h2 class="folha-titulo" id="folha-criar-titulo">Criar</h2>
    <div id="folha-criar-conteudo"></div>
    <button class="botao botao-secundario folha-fechar" type="button" data-acao="fechar-criar">Fechar</button>
  </dialog>

  <dialog class="folha" id="folha-evento" aria-labelledby="folha-evento-titulo">
    <div class="folha-alca" aria-hidden="true"></div>
    <h2 class="folha-titulo" id="folha-evento-titulo">Novo evento</h2>
    <div id="folha-evento-conteudo"></div>
  </dialog>

  <div class="faixa-offline" id="faixa-offline" role="status" hidden>Sem internet. Salvando neste aparelho.</div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
