# Site estático, sem etapa de build: a Netlify publica a pasta raiz como está.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Estes pacotes vão inteiros (sem empacotar): o web-push usa require() do Node, que
  # quebra dentro de um pacote ESM na hora de mandar o aviso.
  external_node_modules = ["web-push", "@anthropic-ai/sdk"]

# O service worker nunca pode ficar preso em cache, senão as atualizações não chegam.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
